<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SASC Morelos - Sistema de Atención y Seguimiento Ciudadano</title>
    <!-- Enlace al archivo de estilos externos -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CABECERA INSTITUCIONAL -->
    <header class="cabecera">
        <div class="contenedor-logo">
            <img src="logo-sasc.jpeg" alt="Escudo SASC Morelos" class="imagen-logo">
        </div>
        <div class="texto-cabecera">
            <h1 class="titulo-principal">SASC Morelos</h1>
            <p class="subtitulo">Sistema de Atención y Seguimiento Ciudadano</p>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="contenido-principal">
        
        <!-- PANTALLA DE INICIO (ESTILO DASHBOARD INSTITUCIONAL) -->
        <div id="view-home" class="vista activa">
            <section class="tarjeta">
                <h3 class="titulo-seccion">Indicadores Municipales</h3>
                <p class="texto-descripcion">Resumen operativo de atención en tiempo real.</p>
                
                <div class="grid-indicadores">
                    <div class="caja-indicador">
                        <p class="numero" id="stat-total">0</p>
                        <p class="etiqueta-ind">Reportes Totales</p>
                    </div>
                    <div class="caja-indicador">
                        <p class="numero">24h</p>
                        <p class="etiqueta-ind">Tiempo Promedio</p>
                    </div>
                </div>
                <button id="btn-nuevo-reporte" class="boton-principal">+ Nuevo Reporte Ciudadano</button>
            </section>
            
            <section class="tarjeta">
                <h3 class="titulo-seccion">Mis Reportes Recientes</h3>
                <div id="lista-reportes-recientes">
                    <p class="texto-vacio">No hay reportes registrados localmente.</p>
                </div>
            </section>
        </div>

        <!-- PANTALLA DE REPORTE -->
        <div id="view-report" class="vista">
            <section class="tarjeta">
                <h3 class="titulo-seccion">Generar Incidencia</h3>
                
                <label class="etiqueta">Dirección o Área Responsable</label>
                <select id="input-categoria" class="campo-texto">
                    <option value="Bacheo y Pavimentación">🚧 Obras Públicas - Bacheo y Pavimentación</option>
                    <option value="Alumbrado Público">💡 Servicios Públicos - Alumbrado</option>
                    <option value="Fugas de Agua / Drenaje">💧 Sistema de Agua Potable</option>
                    <option value="Recolección de Basura">🗑️ Limpieza y Aseo Urbano</option>
                    <option value="Parques y Jardines">🌳 Ecología y Parques</option>
                    <option value="Otro Servicio Municipal">📌 Atención Ciudadana General</option>
                </select>

                <label class="etiqueta">Título breve del problema</label>
                <input type="text" id="input-titulo" class="campo-texto" placeholder="Ej. Luminaria fundida en esquina">
                
                <label class="etiqueta">Descripción detallada</label>
                <textarea id="input-descripcion" class="campo-texto area-texto" placeholder="Detalla referencias para ubicar la incidencia..."></textarea>
                
                <!-- Captura de Fotografía -->
                <label class="etiqueta">Evidencia Fotográfica</label>
                <input type="file" id="input-foto" accept="image/*" capture="environment" class="campo-texto" style="padding: 6px;">
                <div id="image-preview" style="margin-top: 8px;"></div>

                <!-- Ubicación GPS Automática -->
                <label class="etiqueta" style="margin-top: 10px;">Georreferenciación (GPS)</label>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <input type="text" id="input-ubicacion" class="campo-texto" placeholder="Coordenadas automáticas" readonly>
                    <button type="button" id="btn-gps" class="boton-enviar" style="padding: 10px 12px; margin-top: 0; white-space: nowrap; font-size: 0.9rem;">📍 Obtener</button>
                </div>
                <p id="gps-status" style="font-size: 0.8rem; color: #555; margin-top: 4px;"></p>
                
                <button id="btn-enviar-reporte" class="boton-enviar" style="margin-top: 15px;">
                    <span>📤</span> Registrar Folio Oficial
                </button>
            </section>
        </div>
    </main>

    <!-- BARRA DE NAVEGACIÓN INFERIOR -->
    <nav class="navegacion-inferior">
        <a id="nav-inicio" class="enlace-navegacion activo">
            <div class="icono-navegacion">🏠</div>Inicio
        </a>
        <a id="nav-reportar" class="enlace-navegacion">
            <div class="icono-navegacion">📝</div>Reportar
        </a>
    </nav>

    <!-- JAVASCRIPT -->
    <script>
        const vistaInicio = document.getElementById('view-home');
        const vistaReporte = document.getElementById('view-report');
        const navInicio = document.getElementById('nav-inicio');
        const navReportar = document.getElementById('nav-reportar');
        const btnNuevoReporte = document.getElementById('btn-nuevo-reporte');
        const btnEnviarReporte = document.getElementById('btn-enviar-reporte');
        
        const btnGps = document.getElementById('btn-gps');
        const inputUbicacion = document.getElementById('input-ubicacion');
        const gpsStatus = document.getElementById('gps-status');
        const inputFoto = document.getElementById('input-foto');
        const imagePreview = document.getElementById('image-preview');
        const listaReportesRecientes = document.getElementById('lista-reportes-recientes');
        const statTotal = document.getElementById('stat-total');

        function mostrarVista(vista) {
            vistaInicio.classList.remove('activa');
            vistaReporte.classList.remove('activa');
            navInicio.classList.remove('activo');
            navReportar.classList.remove('activo');
            
            if (vista === 'inicio') {
                vistaInicio.classList.add('activa');
                navInicio.classList.add('activo');
                actualizarDashboard();
            } else if (vista === 'reporte') {
                vistaReporte.classList.add('activa');
                navReportar.classList.add('activo');
            }
        }
        
        navInicio.addEventListener('click', (e) => { e.preventDefault(); mostrarVista('inicio'); });
        navReportar.addEventListener('click', (e) => { e.preventDefault(); mostrarVista('reporte'); });
        btnNuevoReporte.addEventListener('click', () => mostrarVista('reporte'));
        
        // Geolocalización GPS
        btnGps.addEventListener('click', () => {
            if (!navigator.geolocation) {
                gpsStatus.textContent = 'Geolocalización no compatible.';
                return;
            }
            gpsStatus.textContent = 'Calculando coordenadas...';
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude.toFixed(5);
                    const lon = position.coords.longitude.toFixed(5);
                    inputUbicacion.value = `Lat: ${lat}, Lon: ${lon}`;
                    gpsStatus.textContent = '✅ Coordenadas fijadas con éxito.';
                },
                (error) => {
                    gpsStatus.textContent = '⚠️ Active el GPS para continuar.';
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        });

        // Vista previa de foto
        let fotoBase64 = '';
        inputFoto.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    fotoBase64 = event.target.result;
                    imagePreview.innerHTML = `<img src="${fotoBase64}" alt="Evidencia" style="width: 100%; max-height: 150px; object-fit: cover; border-radius: 6px;">`;
                }
                reader.readAsDataURL(file);
            }
        });

        // Actualizar Dashboard y Estadísticas
        function actualizarDashboard() {
            const reportes = JSON.parse(localStorage.getItem('sasc_reportes')) || [];
            statTotal.textContent = reportes.length;

            if (reportes.length === 0) {
                listaReportesRecientes.innerHTML = '<p class="texto-vacio">No hay reportes registrados localmente.</p>';
                return;
            }

            let html = '';
            reportes.reverse().forEach(rep => {
                html += `
                    <div class="tarjeta-reporte">
                        <p><span class="folio">Folio: ${rep.folio}</span></p>
                        <p><strong>[${rep.categoria}]</strong> ${rep.titulo}</p>
                        <p style="color: #555; font-size: 0.8rem; margin: 4px 0;">📍 ${rep.ubicacion}</p>
                        <p style="margin: 0;">Estatus: <span class="estado-pendiente">⏳ ${rep.estatus}</span></p>
                    </div>
                `;
            });
            listaReportesRecientes.innerHTML = html;
        }

        // Enviar Reporte
        btnEnviarReporte.addEventListener('click', function() {
            const categoria = document.getElementById('input-categoria').value;
            const titulo = document.getElementById('input-titulo').value;
            const descripcion = document.getElementById('input-descripcion').value;
            const ubicacion = inputUbicacion.value;
            
            if (!titulo.trim() || !descripcion.trim() || !ubicacion.trim() || !fotoBase64) {
                alert('⚠️ Complete los campos obligatorios: Título, Descripción, Fotografía y GPS.');
                return;
            }

            const folioGenerado = 'SASC-MOR-' + Math.floor(100000 + Math.random() * 900000);
            
            const nuevoReporte = {
                folio: folioGenerado,
                categoria,
                titulo,
                descripcion,
                ubicacion,
                estatus: 'Enviado / En revisión',
                fecha: new Date().toLocaleDateString()
            };

            let reportes = JSON.parse(localStorage.getItem('sasc_reportes')) || [];
            reportes.push(nuevoReporte);
            localStorage.setItem('sasc_reportes', JSON.stringify(reportes));
            
            alert(`✅ ¡Folio generado correctamente!\n\nNúmero de Folio: ${folioGenerado}\nLa Dirección de Obras Públicas lo ha recibido.`);
            
            // Limpieza
            document.getElementById('input-titulo').value = '';
            document.getElementById('input-descripcion').value = '';
            inputUbicacion.value = '';
            inputFoto.value = '';
            imagePreview.innerHTML = '';
            gpsStatus.textContent = '';
            fotoBase64 = '';
            
            mostrarVista('inicio');
        });

        // Inicializar
        actualizarDashboard();
    </script>
</body>
</html>

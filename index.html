<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SASC Morelos - Sistema de Atención y Seguimiento Ciudadano</title>
    <!-- Enlace al archivo de estilos -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- CABECERA CON TU LOGOTIPO — TAL CUAL ES -->
    <header class="cabecera">
        <div class="contenedor-logo">
            <!-- TU LOGOTIPO — SOLO PEGA TU IMAGEN CON ESTE NOMBRE -->
            <img src="logo-sasc.jpeg" alt="Escudo SASC Morelos - Gobierno del Estado de Morelos" class="imagen-logo">
        </div>
        <div class="texto-cabecera">
            <h1 class="titulo-principal">SASC Morelos</h1>
            <p class="subtitulo">Sistema de Atención y Seguimiento Ciudadano</p>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="contenido-principal">
        
        <!-- PANTALLA DE INICIO -->
        <div id="view-home" class="vista activa">
            <section class="tarjeta">
                <h3 class="titulo-seccion">Bienvenido</h3>
                <p class="texto-descripcion">Reporta incidencias en tu comunidad de manera rápida y segura.</p>
                <button id="btn-nuevo-reporte" class="boton-principal">+ Nuevo Reporte</button>
            </section>
            <section class="tarjeta">
                <h3 class="titulo-seccion">Mis Reportes Recientes</h3>
                <p class="texto-vacio">No hay reportes registrados localmente.</p>
            </section>
        </div>

        <!-- PANTALLA DE REPORTE -->
        <div id="view-report" class="vista">
            <section class="tarjeta">
                <h3 class="titulo-formulario">Nuevo Reporte</h3>
                
                <label class="etiqueta">Título del reporte</label>
                <input type="text" id="input-titulo" class="campo-texto" placeholder="Ej. Fuga de agua o bache">
                
                <label class="etiqueta">Descripción</label>
                <textarea id="input-descripcion" class="campo-texto area-texto" placeholder="Describe brevemente el problema..."></textarea>
                
                <!-- Captura de Fotografía con la Cámara -->
                <label class="etiqueta">Fotografía de la Incidencia</label>
                <input type="file" id="input-foto" accept="image/*" capture="environment" class="campo-texto" style="padding: 6px;">
                <div id="image-preview" style="margin-top: 8px;"></div>

                <!-- Ubicación GPS Automática -->
                <label class="etiqueta" style="margin-top: 10px;">Ubicación Exacta (GPS)</label>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <input type="text" id="input-ubicacion" class="campo-texto" placeholder="Coordenadas GPS" readonly>
                    <button type="button" id="btn-gps" class="boton-enviar" style="padding: 10px 12px; margin-top: 0; white-space: nowrap; font-size: 0.9rem;">📍 Obtener</button>
                </div>
                <p id="gps-status" style="font-size: 0.8rem; color: #555; margin-top: 4px;"></p>
                
                <button id="btn-enviar-reporte" class="boton-enviar" style="margin-top: 15px;">
                    <span>📤</span> Enviar Reporte
                </button>
            </section>
        </div>
    </main>

    <!-- BARRA DE NAVEGACIÓN INFERIOR -->
    <nav class="navegacion-inferior">
        <a id="nav-inicio" class="enlace-navegacion activo">
            <div class="icono-navegacion">🏠</div>Inicio
        </a>
        <a id="nav-reportar" class="enlace-navegacion">
            <div class="icono-navegacion">📝</div>Reportar
        </a>
    </nav>

    <!-- JAVASCRIPT -->
    <script>
        const vistaInicio = document.getElementById('view-home');
        const vistaReporte = document.getElementById('view-report');
        const navInicio = document.getElementById('nav-inicio');
        const navReportar = document.getElementById('nav-reportar');
        const btnNuevoReporte = document.getElementById('btn-nuevo-reporte');
        const btnEnviarReporte = document.getElementById('btn-enviar-reporte');
        
        const btnGps = document.getElementById('btn-gps');
        const inputUbicacion = document.getElementById('input-ubicacion');
        const gpsStatus = document.getElementById('gps-status');
        const inputFoto = document.getElementById('input-foto');
        const imagePreview = document.getElementById('image-preview');

        function mostrarVista(vista) {
            vistaInicio.classList.remove('activa');
            vistaReporte.classList.remove('activa');
            navInicio.classList.remove('activo');
            navReportar.classList.remove('activo');
            
            if (vista === 'inicio') {
                vistaInicio.classList.add('activa');
                navInicio.classList.add('activo');
            } else if (vista === 'reporte') {
                vistaReporte.classList.add('activa');
                navReportar.classList.add('activo');
            }
        }
        
        // Navegación
        navInicio.addEventListener('click', (e) => {
            e.preventDefault();
            mostrarVista('inicio');
        });
        navReportar.addEventListener('click', (e) => {
            e.preventDefault();
            mostrarVista('reporte');
        });
        btnNuevoReporte.addEventListener('click', () => mostrarVista('reporte'));
        
        // Obtener Geolocalización GPS
        btnGps.addEventListener('click', () => {
            if (!navigator.geolocation) {
                gpsStatus.textContent = 'Tu dispositivo no soporta geolocalización.';
                return;
            }
            
            gpsStatus.textContent = 'Obteniendo ubicación exacta...';
            
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude.toFixed(5);
                    const lon = position.coords.longitude.toFixed(5);
                    inputUbicacion.value = `Lat: ${lat}, Lon: ${lon}`;
                    gpsStatus.textContent = '✅ Ubicación fija obtenida correctamente.';
                },
                (error) => {
                    gpsStatus.textContent = '⚠️ Permiso de ubicación denegado o no disponible.';
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        });

        // Vista previa de la foto tomada
        inputFoto.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    imagePreview.innerHTML = `<img src="${event.target.result}" alt="Evidencia" style="width: 100%; max-height: 150px; object-fit: cover; border-radius: 6px;">`;
                }
                reader.readAsDataURL(file);
            }
        });

        // Enviar reporte
        btnEnviarReporte.addEventListener('click', function() {
            const titulo = document.getElementById('input-titulo').value;
            const descripcion = document.getElementById('input-descripcion').value;
            const ubicacion = inputUbicacion.value;
            const foto = inputFoto.files[0];
            
            if (!titulo.trim() || !descripcion.trim() || !ubicacion.trim() || !foto) {
                alert('⚠️ Por favor completa el título, la descripción, toma la foto y obtén la ubicación GPS.');
                return;
            }
            
            alert('✅ ¡Reporte generado con éxito!\n\nFolio SASC registrado y listo para operar.');
            
            // Limpiar campos
            document.getElementById('input-titulo').value = '';
            document.getElementById('input-descripcion').value = '';
            inputUbicacion.value = '';
            inputFoto.value = '';
            imagePreview.innerHTML = '';
            gpsStatus.textContent = '';
            
            // Regresar a Inicio
            mostrarVista('inicio');
        });
    </script>
</body>
</html>
